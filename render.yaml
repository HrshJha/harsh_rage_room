services:
  - type: web
    name: harsh-rage-room-api
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci --include=dev && npm run build:api
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 24.14.1
      - key: NODE_ENV
        value: production
      - key: NOTIFY_ENABLED
        value: "true"
      - key: NOTIFY_DRY_RUN
        value: "false"
      - key: ALLOWED_ORIGINS
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
